let tab='login'; let userData=null; let materiaActual=null; let nivelActual=1; let preguntasNivel=[]; let idxPreg=0; let aciertos=0;
function setTab(t){tab=t; document.getElementById('tabLogin').className=t==='login'?'px-4 py-2 rounded-full text-sm font-semibold bg-black text-white':'px-4 py-2 rounded-full text-sm font-semibold bg-black/5'; document.getElementById('tabReg').className=t==='reg'?'px-4 py-2 rounded-full text-sm font-semibold bg-black text-white':'px-4 py-2 rounded-full text-sm font-semibold bg-black/5'; document.getElementById('formLogin').classList.toggle('hidden',t!=='login'); document.getElementById('formReg').classList.toggle('hidden',t!=='reg');}
function setMsg(m){document.getElementById('msg').innerText=m;}
async function registroEmail(){const nombre=document.getElementById('regNombre').value.trim(); const email=document.getElementById('regEmail').value.trim(); const tel=document.getElementById('regTel').value.trim(); const pass=document.getElementById('regPass').value; if(!nombre||!email||!pass){setMsg('Completa datos');return;} if(pass.length<6){setMsg('Min 6 chars');return;} try{const cred=await auth.createUserWithEmailAndPassword(email,pass); localStorage.clear(); await db.collection('users').doc(cred.user.uid).set({nombre,email,telefono:tel,monedas:0,progreso:{espanol:0,matematicas:0,historia:0,geografia:0,ciencias:0,civica:0},niveles:{espanol:0,matematicas:0,historia:0,geografia:0,ciencias:0,civica:0},creado:firebase.firestore.FieldValue.serverTimestamp()}); setMsg('Cuenta creada');}catch(e){setMsg(e.message);}}
async function loginEmail(){const email=document.getElementById('loginEmail').value.trim(); const pass=document.getElementById('loginPass').value; try{await auth.signInWithEmailAndPassword(email,pass);}catch(e){setMsg('Error: '+e.message);}}
async function loginGoogle(){try{const provider=new firebase.auth.GoogleAuthProvider(); await auth.signInWithPopup(provider);}catch(e){setMsg('Google: '+e.message);}}
function cerrarSesion(){auth.signOut(); localStorage.clear();}

auth.onAuthStateChanged(async (user)=>{
 if(user){
   document.getElementById('loginView').classList.add('hidden'); document.getElementById('dashView').classList.remove('hidden'); document.getElementById('userBadge').classList.remove('hidden'); document.getElementById('userBadge').classList.add('flex'); document.getElementById('userName').innerText=user.displayName||user.email.split('@')[0]; document.getElementById('avatar').innerText=(user.displayName||user.email)[0].toUpperCase();
   const ref=db.collection('users').doc(user.uid); let snap=await ref.get();
   if(!snap.exists){
     await ref.set({nombre:user.displayName||'Alumno', email:user.email, telefono:'', monedas:0, progreso:{espanol:0,matematicas:0,historia:0,geografia:0,ciencias:0,civica:0}, niveles:{espanol:0,matematicas:0,historia:0,geografia:0,ciencias:0,civica:0}, creado:firebase.firestore.FieldValue.serverTimestamp()});
     snap=await ref.get();
   } else {
     // MIGRACION: si usuario viejo no tiene niveles, agregarlo sin borrar progreso
     const data=snap.data();
     if(!data.niveles){
       await ref.update({niveles:{espanol:0,matematicas:0,historia:0,geografia:0,ciencias:0,civica:0}});
       snap=await ref.get();
     }
     if(!data.progreso){
       await ref.update({progreso:{espanol:0,matematicas:0,historia:0,geografia:0,ciencias:0,civica:0}});
       snap=await ref.get();
     }
   }
   userData=snap.data();
   // asegurar defaults
   if(!userData.niveles) userData.niveles={espanol:0,matematicas:0,historia:0,geografia:0,ciencias:0,civica:0};
   if(!userData.progreso) userData.progreso={espanol:0,matematicas:0,historia:0,geografia:0,ciencias:0,civica:0};
   if(userData.monedas==null) userData.monedas=0;
   document.getElementById('dashNombre').innerText=userData.nombre||'Alumno'; document.getElementById('dashEmail').innerText=userData.email; document.getElementById('dashMonedas').innerText=userData.monedas||0; document.getElementById('dashProm').innerText=calcProm()+'%'; renderMaterias();
 } else {
   document.getElementById('loginView').classList.remove('hidden'); document.getElementById('dashView').classList.add('hidden'); document.getElementById('userBadge').classList.add('hidden'); userData=null;
 }
});

function calcProm(){if(!userData) return 0; const p=userData.progreso||{}; const vals=Object.values(p); if(vals.length===0) return 0; const sum=vals.reduce((a,b)=>a+(b||0),0); return Math.round(sum/vals.length);}

const materiasInfo={espanol:{nombre:'Español',emoji:'📚',color:'#7c3aed',desc:'Lectura y gramática'},matematicas:{nombre:'Matemáticas',emoji:'➗',color:'#0d9488',desc:'Operaciones 6to'},historia:{nombre:'Historia',emoji:'🏛️',color:'#92400e',desc:'México y el mundo'},geografia:{nombre:'Geografía',emoji:'🌎',color:'#16a34a',desc:'Territorio'},ciencias:{nombre:'Ciencias Naturales',emoji:'🔬',color:'#db2777',desc:'Cuerpo y ecosistemas'},civica:{nombre:'F. Cívica',emoji:'⚖️',color:'#4f46e5',desc:'Constitución'}};

function renderMaterias(){const grid=document.getElementById('materiasGrid'); grid.innerHTML=''; document.getElementById('nivelesView').classList.add('hidden'); document.getElementById('juegoView').classList.add('hidden'); grid.classList.remove('hidden'); Object.keys(materiasInfo).forEach(key=>{const info=materiasInfo[key]; const nivel=(userData?.niveles?.[key]||0); const prog=(userData?.progreso?.[key]||0); const div=document.createElement('div'); div.className='bg-white rounded-2xl p-5 border border-black/5 cursor-pointer hover:shadow-lg transition'; div.style.borderTop=`4px solid ${info.color}`; div.innerHTML=`<div class="flex justify-between"><span class="text-2xl">${info.emoji}</span><span class="text-xs font-bold px-2 py-1 rounded-full bg-black/5">${prog}%</span></div><p class="font-bold mt-2">${info.nombre}</p><p class="text-xs opacity-60">${info.desc} • Nivel ${nivel}/10 • 100 preg</p><div class="mt-3 flex gap-1">${Array.from({length:10}).map((_,i)=>`<div class="h-1.5 flex-1 rounded-full ${i<nivel?'bg-black':'bg-black/10'}"></div>`).join('')}</div><button class="mt-3 w-full h-9 rounded-xl bg-black text-white text-xs font-bold">Jugar Nivel ${Math.min(nivel+1,10)}</button>`; div.onclick=()=>abrirMateria(key); grid.appendChild(div);});}

function abrirMateria(key){materiaActual=key; document.getElementById('materiasGrid').classList.add('hidden'); document.getElementById('nivelesView').classList.remove('hidden'); document.getElementById('materiaTitulo').innerText=materiasInfo[key].nombre+' - 10 niveles (100 preguntas)'; const nivelesGrid=document.getElementById('nivelesGrid'); nivelesGrid.innerHTML=''; const nivelUsuario=(userData?.niveles?.[key]||0); for(let i=1;i<=10;i++){const desbloqueado=i<=nivelUsuario+1; const completado=i<=nivelUsuario; const btn=document.createElement('button'); btn.className=`h-20 rounded-2xl border text-sm font-bold ${desbloqueado?'bg-white border-black/10 hover:shadow':'bg-black/5 border-black/5 opacity-40'}`; btn.innerHTML=`Nivel ${i}<br><span class="text-xs">${completado?'✓ Completado':desbloqueado?'Jugar 10 preg':'Bloqueado'}</span>`; btn.disabled=!desbloqueado; btn.onclick=()=>iniciarNivel(i); nivelesGrid.appendChild(btn);}}

function mostrarMaterias(){renderMaterias();}

function iniciarNivel(n){nivelActual=n; const todas=bancos[materiaActual]; const inicio=(n-1)*10; preguntasNivel=todas.slice(inicio,inicio+10); idxPreg=0; aciertos=0; document.getElementById('nivelesView').classList.add('hidden'); document.getElementById('juegoView').classList.remove('hidden'); mostrarPreg();}

function mostrarPreg(){const q=preguntasNivel[idxPreg]; document.getElementById('juegoInfo').innerText=`${materiasInfo[materiaActual].nombre} - Nivel ${nivelActual}`; document.getElementById('juegoProg').innerText=`Pregunta ${idxPreg+1}/10`; document.getElementById('juegoPreg').innerText=q.p; const cont=document.getElementById('juegoOpcs'); cont.innerHTML=''; document.getElementById('juegoExp').classList.add('hidden'); document.getElementById('juegoNext').classList.add('hidden'); q.o.forEach((op,i)=>{const b=document.createElement('button'); b.className='w-full text-left p-3 rounded-xl border border-black/10 bg-white hover:bg-black/5 text-sm'; b.innerText=op; b.onclick=()=>responder(i); cont.appendChild(b);});}

function responder(i){const q=preguntasNivel[idxPreg]; const correcta=q.c; const exp=document.getElementById('juegoExp'); exp.classList.remove('hidden'); if(i===correcta){aciertos++; exp.innerText='✅ Correcto! '+q.ex; exp.className='mt-4 text-sm p-3 rounded-xl bg-green-50 border border-green-200';} else {exp.innerText='❌ Incorrecto. '+q.ex; exp.className='mt-4 text-sm p-3 rounded-xl bg-red-50 border border-red-200';} document.querySelectorAll('#juegoOpcs button').forEach(b=>b.disabled=true); document.getElementById('juegoNext').classList.remove('hidden'); document.getElementById('juegoNext').innerText= idxPreg===9 ? 'Terminar nivel' : 'Siguiente';}

async function siguientePreg(){idxPreg++; if(idxPreg<10){mostrarPreg();} else {const paso=aciertos>=7; alert(`Nivel ${nivelActual}: ${aciertos}/10 ${paso?'¡Desbloqueas siguiente!':''}`); const ref=db.collection('users').doc(auth.currentUser.uid); const nuevosNiveles={...(userData.niveles||{})}; if(paso && nivelActual> (userData.niveles?.[materiaActual]||0)){nuevosNiveles[materiaActual]=nivelActual;} const nuevoProgreso={...(userData.progreso||{})}; nuevoProgreso[materiaActual]=Math.round((nuevosNiveles[materiaActual]/10)*100); const nuevasMonedas=(userData.monedas||0)+aciertos*10; await ref.update({niveles:nuevosNiveles, progreso:nuevoProgreso, monedas:nuevasMonedas}); userData.niveles=nuevosNiveles; userData.progreso=nuevoProgreso; userData.monedas=nuevasMonedas; document.getElementById('juegoView').classList.add('hidden'); abrirMateria(materiaActual); document.getElementById('dashMonedas').innerText=userData.monedas; document.getElementById('dashProm').innerText=calcProm()+'%';}}
</script>
